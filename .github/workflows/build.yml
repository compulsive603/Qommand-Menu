name: Build Command Menu Mod

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORGE_VERSION: "1.20.1-47.1.3"
  MOD_ID: "commandmenu"
  MOD_GROUP_ID: "com.example.commandmenu"
  MOD_NAME: "Command Menu"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate mod source in repository
        id: locate
        run: |
          echo "Listing top files in repo:"
          git ls-files | sed -n '1,50p'

          # Locate CommandMenuMod.java using the git index (ignores build artifacts, .git, etc.)
          MATCHES=$(git ls-files '**/CommandMenuMod.java')
          COUNT=$(printf '%s\n' "$MATCHES" | grep -c . || true)

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::CommandMenuMod.java was not found in the repository. Please upload your 'src' folder."
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "::error::Found $COUNT copies of CommandMenuMod.java. Please remove duplicate source folders."
            echo "$MATCHES"
            exit 1
          fi

          # Resolve the src/main root from the location of CommandMenuMod.java.
          # e.g. src/main/java/com/example/commandmenu/CommandMenuMod.java -> src/main
          SRC_MAIN="${MATCHES%/java/*}"

          if [ -z "$SRC_MAIN" ] || [ "$SRC_MAIN" = "$MATCHES" ]; then
            echo "::error::Could not derive src/main root from '$MATCHES' (expected .../java/... in path)."
            exit 1
          fi

          if [ ! -d "$SRC_MAIN/java" ]; then
            echo "::error::Resolved source root '$SRC_MAIN' has no 'java' subdirectory."
            exit 1
          fi

          echo "Found mod source root: $SRC_MAIN"
          echo "src_main=$SRC_MAIN" >> "$GITHUB_OUTPUT"

      - name: Download Forge MDK
        run: |
          curl -fL -o mdk.zip \
            "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-mdk.zip"

          mkdir -p mdk_extract
          unzip -q mdk.zip -d mdk_extract
          rm -f mdk.zip

          # The MDK zip contains a single top-level directory (forge-<ver>-mdk/).
          # Flatten it so that mdk/gradlew and mdk/src exist.
          ENTRY_COUNT=$(find mdk_extract -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$ENTRY_COUNT" -ne 1 ]; then
            echo "::error::Unexpected MDK layout: expected exactly one top-level directory, found $ENTRY_COUNT."
            find mdk_extract -mindepth 1 -maxdepth 1
            exit 1
          fi

          TOP_DIR=$(find mdk_extract -mindepth 1 -maxdepth 1 -type d)
          mv "$TOP_DIR" mdk
          rmdir mdk_extract

          if [ ! -f mdk/gradlew ] || [ ! -d mdk/src/main ]; then
            echo "::error::MDK extraction did not yield mdk/gradlew and mdk/src/main."
            ls -la mdk
            exit 1
          fi

      - name: Inject Mod Source into MDK
        run: |
          SRC_MAIN="${{ steps.locate.outputs.src_main }}"

          # Swap Java source files
          rm -rf mdk/src/main/java
          cp -r "$SRC_MAIN/java" mdk/src/main/java

          # Swap resources if present
          mkdir -p mdk/src/main/resources
          if [ -d "$SRC_MAIN/resources" ]; then
            cp -r "$SRC_MAIN/resources/." mdk/src/main/resources/
          fi

          # Update build properties inside the MDK and verify the substitutions applied.
          cd mdk
          for pair in "mod_id=${MOD_ID}" "mod_group_id=${MOD_GROUP_ID}" "mod_name=${MOD_NAME}"; do
            key="${pair%%=*}"
            value="${pair#*=}"
            if ! grep -qE "^${key}=" gradle.properties; then
              echo "::error::gradle.properties in MDK does not contain '${key}=' — cannot override."
              exit 1
            fi
            sed -i "s|^${key}=.*|${key}=${value}|" gradle.properties
          done

          echo "--- gradle.properties overrides applied ---"
          grep -E '^(mod_id|mod_group_id|mod_name)=' gradle.properties

      - name: Build Mod
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: commandmenu-jar
          path: mdk/build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required only for publishing the GitHub release on v* tags
    steps:
      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: commandmenu-jar
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar
