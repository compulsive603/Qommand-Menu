name: Build Command Menu Mod

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write   # Required for publishing GitHub releases on v* tags

env:
  FORGE_VERSION: "1.20.1-47.1.3"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate mod source in repository
        id: locate
        run: |
          echo "Listing top files in repo:"
          git ls-files | head -50

          # Locate CommandMenuMod.java anywhere in the repository
          MATCHES=$(find . -path ./mdk -prune -o -name CommandMenuMod.java -print)
          COUNT=$(echo "$MATCHES" | grep -c . || true)

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::CommandMenuMod.java was not found in the repository. Please upload your 'src' folder."
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "::error::Found $COUNT copies of CommandMenuMod.java. Please remove duplicate source folders."
            echo "$MATCHES"
            exit 1
          fi

          # Resolve the src/main root folder from the location of CommandMenuMod.java
          SRC_MAIN=$(dirname "$MATCHES" | sed 's#/java/.*##')
          echo "Found mod source root: $SRC_MAIN"
          echo "src_main=$SRC_MAIN" >> "$GITHUB_OUTPUT"

      - name: Download Forge MDK
        run: |
          curl -fL -o mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-mdk.zip"
          mkdir mdk
          unzip -q mdk.zip -d mdk

      - name: Inject Mod Source into MDK
        run: |
          SRC_MAIN="${{ steps.locate.outputs.src_main }}"

          # Swap Java source files
          rm -rf mdk/src/main/java
          cp -r "$SRC_MAIN/java" mdk/src/main/java

          # Swap resources if present
          if [ -d "$SRC_MAIN/resources" ]; then
            cp -r "$SRC_MAIN/resources/." mdk/src/main/resources/
          fi

          # Update build properties inside the MDK
          cd mdk
          sed -i 's/^mod_id=.*/mod_id=commandmenu/' gradle.properties || true
          sed -i 's/^mod_group_id=.*/mod_group_id=com.example.commandmenu/' gradle.properties || true
          sed -i 's/^mod_name=.*/mod_name=Command Menu/' gradle.properties || true

      - name: Build Mod
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: commandmenu-jar
          path: mdk/build/libs/*.jar
          if-no-files-found: error

      - name: Publish GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mdk/build/libs/*.jar
