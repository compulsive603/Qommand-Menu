[[mods]]
modId="commandlist"
version="1.1.0"
displayName="Command List"
description='''
Press K to browse every command in the game (vanilla and modded) with the mod it belongs to,
a description, search, sorting, one-click Use / Copy and custom keyboard shortcuts. Client-side only.
'''
# Client-only mod: lets players join servers that don't have it installed.
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.commandlist]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.commandlist]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"
