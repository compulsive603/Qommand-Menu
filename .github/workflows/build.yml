name: Build mod

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the jar to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle 8.5 on the runner, so the build works even if gradlew was not committed
      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Check project files
        run: |
          ls -la
          test -f build.gradle || { echo "::error::build.gradle not found in repo root. Commit the contents of the commandlist folder, not the folder itself."; exit 1; }

      - name: Build
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: commandlist-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Pushing a tag like v1.1.0 publishes a GitHub Release with the jar attached
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true

